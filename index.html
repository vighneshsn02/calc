<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple, elegant, and modern calculator featuring Standard, Scientific, and Age calculation modes.">
    <title>Calculator</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-wrapper">
        <div class="calculator" id="main-calculator">
            <!-- Top App Bar -->
            <header class="calc-header">
                <!-- Mode Switcher Tabs -->
                <nav class="mode-tabs" role="tablist" aria-label="Calculator Modes">
                    <button class="mode-tab active" data-tab="standard" role="tab" aria-selected="true" aria-controls="tab-standard" id="tab-btn-standard">
                        Standard
                    </button>
                    <button class="mode-tab" data-tab="scientific" role="tab" aria-selected="false" aria-controls="tab-scientific" id="tab-btn-scientific">
                        Scientific
                    </button>
                    <button class="mode-tab" data-tab="age" role="tab" aria-selected="false" aria-controls="tab-age" id="tab-btn-age">
                        Age
                    </button>
                </nav>

                <!-- Header Actions -->
                <div class="calc-actions">
                    <button class="icon-action-btn" id="history-toggle-btn" title="Calculation History" aria-label="Toggle History">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span class="history-badge" id="history-badge" style="display: none;"></span>
                    </button>
                    <button class="icon-action-btn" id="theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Light/Dark Theme">
                        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- STANDARD CALCULATOR -->
            <main class="tab-panel active" id="tab-standard" role="tabpanel" aria-labelledby="tab-btn-standard">
                <div class="screen-area" id="std-screen" title="Click to copy result">
                    <div class="expression-preview" id="std-expression">&nbsp;</div>
                    <div class="result-display" id="std-display">0</div>
                </div>

                <div class="keypad std-grid">
                    <button class="key key-func" data-action="clear" id="key-clear">AC</button>
                    <button class="key key-func" data-action="backspace" aria-label="Delete last character">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
                    </button>
                    <button class="key key-func" data-action="percent">%</button>
                    <button class="key key-op" data-action="operator" data-value="/">÷</button>

                    <button class="key key-num" data-value="7">7</button>
                    <button class="key key-num" data-value="8">8</button>
                    <button class="key key-num" data-value="9">9</button>
                    <button class="key key-op" data-action="operator" data-value="*">×</button>

                    <button class="key key-num" data-value="4">4</button>
                    <button class="key key-num" data-value="5">5</button>
                    <button class="key key-num" data-value="6">6</button>
                    <button class="key key-op" data-action="operator" data-value="-">−</button>

                    <button class="key key-num" data-value="1">1</button>
                    <button class="key key-num" data-value="2">2</button>
                    <button class="key key-num" data-value="3">3</button>
                    <button class="key key-op" data-action="operator" data-value="+">+</button>

                    <button class="key key-func" data-action="negate">±</button>
                    <button class="key key-num" data-value="0">0</button>
                    <button class="key key-num" data-value=".">.</button>
                    <button class="key key-equals" data-action="equals">=</button>
                </div>
            </main>

            <!-- SCIENTIFIC CALCULATOR -->
            <main class="tab-panel" id="tab-scientific" role="tabpanel" aria-labelledby="tab-btn-scientific">
                <div class="screen-area" id="sci-screen" title="Click to copy result">
                    <div class="screen-top-bar">
                        <button class="mode-toggle-pill" id="angle-mode-btn" title="Toggle Angle Mode (DEG/RAD)">DEG</button>
                    </div>
                    <div class="expression-preview" id="sci-expression">&nbsp;</div>
                    <div class="result-display" id="sci-display">0</div>
                </div>

                <div class="keypad sci-grid">
                    <!-- Scientific Functions -->
                    <button class="key key-sci" data-action="sci-func" data-value="sin">sin</button>
                    <button class="key key-sci" data-action="sci-func" data-value="cos">cos</button>
                    <button class="key key-sci" data-action="sci-func" data-value="tan">tan</button>
                    <button class="key key-sci" data-action="sci-func" data-value="ln">ln</button>
                    <button class="key key-sci" data-action="sci-func" data-value="log">log</button>

                    <button class="key key-sci" data-action="sci-func" data-value="asin">sin⁻¹</button>
                    <button class="key key-sci" data-action="sci-func" data-value="acos">cos⁻¹</button>
                    <button class="key key-sci" data-action="sci-func" data-value="atan">tan⁻¹</button>
                    <button class="key key-sci" data-action="sci-const" data-value="e">e</button>
                    <button class="key key-sci" data-action="sci-const" data-value="pi">π</button>

                    <button class="key key-sci" data-action="sci-op" data-value="^">xʸ</button>
                    <button class="key key-sci" data-action="sci-func" data-value="sqr">x²</button>
                    <button class="key key-sci" data-action="sci-func" data-value="sqrt">√x</button>
                    <button class="key key-func" data-action="clear">AC</button>
                    <button class="key key-func" data-action="backspace" aria-label="Delete">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
                    </button>

                    <button class="key key-sci" data-action="insert" data-value="(">(</button>
                    <button class="key key-sci" data-action="insert" data-value=")"><span style="letter-spacing: 0;">)</span></button>
                    <button class="key key-sci" data-action="sci-func" data-value="fact">n!</button>
                    <button class="key key-func" data-action="percent">%</button>
                    <button class="key key-op" data-action="operator" data-value="/">÷</button>

                    <button class="key key-num" data-value="7">7</button>
                    <button class="key key-num" data-value="8">8</button>
                    <button class="key key-num" data-value="9">9</button>
                    <button class="key key-op" data-action="operator" data-value="*">×</button>
                    <button class="key key-sci" data-action="sci-func" data-value="cbrt">³√x</button>

                    <button class="key key-num" data-value="4">4</button>
                    <button class="key key-num" data-value="5">5</button>
                    <button class="key key-num" data-value="6">6</button>
                    <button class="key key-op" data-action="operator" data-value="-">−</button>
                    <button class="key key-sci" data-action="sci-func" data-value="inv">1/x</button>

                    <button class="key key-num" data-value="1">1</button>
                    <button class="key key-num" data-value="2">2</button>
                    <button class="key key-num" data-value="3">3</button>
                    <button class="key key-op" data-action="operator" data-value="+">+</button>
                    <button class="key key-sci" data-action="sci-func" data-value="abs">|x|</button>

                    <button class="key key-func" data-action="negate">±</button>
                    <button class="key key-num" data-value="0">0</button>
                    <button class="key key-num" data-value=".">.</button>
                    <button class="key key-equals" data-action="equals">=</button>
                    <button class="key key-sci" data-action="sci-func" data-value="exp">EXP</button>
                </div>
            </main>

            <!-- AGE CALCULATOR -->
            <main class="tab-panel" id="tab-age" role="tabpanel" aria-labelledby="tab-btn-age">
                <div class="age-wrapper">
                    <!-- Date Inputs -->
                    <div class="age-inputs-card">
                        <div class="form-group">
                            <label for="dob-input">Date of Birth</label>
                            <input type="date" id="dob-input" aria-label="Date of birth">
                        </div>
                        <div class="form-group">
                            <label for="target-date-input">Age on Date</label>
                            <input type="date" id="target-date-input" aria-label="Target date for age calculation">
                        </div>
                        <button class="btn-calc-age" id="calc-age-btn">
                            Calculate Age
                        </button>
                    </div>

                    <!-- Age Result Breakdown -->
                    <div class="age-result-container" id="age-results-area">
                        <!-- Hero Age Result -->
                        <div class="age-hero-card">
                            <div class="age-hero-title">Your Age</div>
                            <div class="age-hero-units">
                                <div class="unit-item">
                                    <span class="unit-num" id="age-years">0</span>
                                    <span class="unit-text">Years</span>
                                </div>
                                <div class="unit-item">
                                    <span class="unit-num" id="age-months">0</span>
                                    <span class="unit-text">Months</span>
                                </div>
                                <div class="unit-item">
                                    <span class="unit-num" id="age-days">0</span>
                                    <span class="unit-text">Days</span>
                                </div>
                            </div>
                        </div>

                        <!-- Next Birthday Card -->
                        <div class="next-birthday-banner">
                            <div class="bday-icon">🎂</div>
                            <div class="bday-text-group">
                                <span class="bday-label">Next Birthday</span>
                                <span class="bday-val" id="next-bday-text">Select your date of birth</span>
                            </div>
                        </div>

                        <!-- Secondary Stats -->
                        <div class="age-stats-grid">
                            <div class="stat-box">
                                <span class="stat-name">Total Months</span>
                                <span class="stat-value" id="stat-total-months">0</span>
                            </div>
                            <div class="stat-box">
                                <span class="stat-name">Total Weeks</span>
                                <span class="stat-value" id="stat-total-weeks">0</span>
                            </div>
                            <div class="stat-box">
                                <span class="stat-name">Total Days</span>
                                <span class="stat-value" id="stat-total-days">0</span>
                            </div>
                            <div class="stat-box">
                                <span class="stat-name">Total Hours</span>
                                <span class="stat-value" id="stat-total-hours">0</span>
                            </div>
                            <div class="stat-box">
                                <span class="stat-name">Total Minutes</span>
                                <span class="stat-value" id="stat-total-minutes">0</span>
                            </div>
                            <div class="stat-box">
                                <span class="stat-name">Day of Birth</span>
                                <span class="stat-value" id="stat-dob-day">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- Collapsible / Overlay History Drawer -->
            <div class="history-drawer-backdrop" id="history-backdrop"></div>
            <aside class="history-drawer" id="history-panel" aria-label="Calculation History" aria-hidden="true">
                <div class="history-drawer-header">
                    <h3>History</h3>
                    <div class="history-header-actions">
                        <button class="clear-btn" id="clear-history-btn" title="Clear History">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                            Clear
                        </button>
                        <button class="close-drawer-btn" id="close-history-btn" title="Close History">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="history-drawer-body" id="history-list">
                    <div class="empty-history">No calculations yet</div>
                </div>
            </aside>

            <!-- Toast feedback for copy -->
            <div class="toast-feedback" id="toast-feedback">Copied to clipboard</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
